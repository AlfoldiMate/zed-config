[package]
name = "keycook"
version = "0.1.0"
edition = "2021"
description = "A keymap DSL for Zed: hierarchical contexts, compiled to keymap.json, with an LSP"
license = "MIT"

[[bin]]
name = "keycook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp = "0.20"

[profile.release]
opt-level = 2
strip = true
